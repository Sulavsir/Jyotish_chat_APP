<!DOCTYPE html>
<html>
<head>
    <title>Clear Admin Cookies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0e27;
            color: white;
        }
        .btn {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <h1>🔧 Clear Admin Cookies</h1>
    <p>This will clear all cookies and local storage for the admin panel.</p>
    
    <button class="btn" onclick="clearEverything()">Clear All Cookies & Logout</button>
    
    <div id="status" class="status" style="display:none;"></div>
    
    <script>
        function clearEverything() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '🔄 Clearing...';
            
            // Clear all cookies
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            // Clear localStorage
            localStorage.clear();
            
            // Clear sessionStorage
            sessionStorage.clear();
            
            statusDiv.innerHTML = '✅ All cookies and storage cleared!<br>Redirecting to login...';
            
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        }
    </script>
</body>
</html>
